version: '3'

info:
  companyName: "OdooNoir"
  productName: "OdooNoir"
  productIdentifier: "com.ahmed.odoonoir"
  description: "Odoo instance manager — create, manage and monitor Odoo installations"
  version: "0.23.0"
  copyright: "© 2026 Ahmed"
  author:
    name: "Ahmed"

linux:
  desktop:
    comment: "Odoo instance manager"
    categories: "Development;Utility;"
    keywords: "odoo;erp;instance;manager;"
    mimeType: ""
  deb:
    depends:
      - libgtk-3-0
      - libwebkit2gtk-4.1-0 | libwebkit2gtk-4.0-37
      - libayatana-appindicator3-1 | libappindicator3-1
    section: "utils"
    priority: "optional"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js"
      - "*.ts"
    git_ignore: true
  executes:
    - cmd: npm run dev
      type: background
      dir: frontend
    - cmd: go run .
      type: primary
